# /etc/nginx/sites-available/smart-vision-jteit
# Ganti presensi.contoh.ac.id dengan nama domain/subdomain dari UPT TIK kampus.

server {
    listen 80;
    listen [::]:80;
    server_name presensi.contoh.ac.id;
    return 301 https://$host$request_uri;
}

server {
    # Bentuk ini didukung Nginx 1.18 (Ubuntu 22.04) dan 1.24 (Ubuntu 24.04).
    # Pada Nginx >= 1.25.1 boleh diganti "listen 443 ssl;" + "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name presensi.contoh.ac.id;

    # Sertifikat dari UPT TIK atau Let's Encrypt (certbot --nginx)
    ssl_certificate     /etc/ssl/smart-vision-jteit/fullchain.pem;
    ssl_certificate_key /etc/ssl/smart-vision-jteit/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Bingkai kamera dan CSV KRS (maks. 1 MB) cukup dengan 2 MB
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # Kamera hanya untuk halaman ini sendiri (mode kios & pendaftaran wajah)
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
